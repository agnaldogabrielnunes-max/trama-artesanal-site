<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>LAR Gestão · Painel ADM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0E3A4F; --navy-d:#082A3B; --navy-dd:#061E2B; --teal:#1F7A8C; --teal-l:#3FA7BA;
  --orange:#F57C20; --orange-d:#D9650F; --cream:#F6F3EE;
  --bg:#061E2B; --panel:#0B2C3E; --panel2:#103A50; --line:#1B4a60; --text:#EAF2F5; --mut:#8FB0BD;
  --ok:#2ECC8F; --warn:#F5B820; --bad:#EF5B5B; --r:16px;
}
:root[data-theme="light"]{
  --bg:#F6F3EE; --panel:#FFFFFF; --panel2:#EFEAE2; --line:#E0D9CD; --text:#0E3A4F; --mut:#5F7C89;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select,textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;width:100%}
input:focus,select:focus{border-color:var(--orange)}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#1F7A8C55,transparent 45%),radial-gradient(circle at 90% 90%,#F57C2033,transparent 40%),var(--navy-dd)}
.lcard{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 30px 80px #0008}
.lcard h1{font-size:22px;margin:18px 0 4px}.lcard p{color:var(--mut);margin-bottom:20px;font-size:13px}
.lcard label{display:block;margin:12px 0 6px;font-size:12px;color:var(--mut)}
.err{color:var(--bad);font-size:12px;margin-top:10px;min-height:16px}
/* logo */
.logo{display:flex;align-items:center;gap:10px}
.logo svg{width:40px;height:40px;flex:none}
.logo b{display:block;font-weight:800;font-size:17px;letter-spacing:.2px;line-height:1}
.logo small{display:block;font-size:9px;letter-spacing:2.4px;color:var(--orange);font-weight:600;margin-top:3px}
.lg{width:170px;display:block;margin:0 auto 6px}.lg-l{display:none}:root[data-theme="light"] .lg-d{display:none}:root[data-theme="light"] .lg-l{display:block}.lg-side{width:150px;display:block;margin:4px auto 2px}
.logo{justify-content:center}
.btn{text-decoration:none;display:inline-block;background:var(--orange);color:#fff;font-weight:700;border-radius:999px;padding:11px 22px;transition:.15s}
.btn:hover{background:var(--orange-d)}
.btn.ghost{background:var(--panel2);color:var(--text);font-weight:600}
.btn.sm{padding:7px 14px;font-size:12px}
.btn.full{width:100%;margin-top:18px}
/* shell */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--navy-dd);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
:root[data-theme="light"] aside{background:var(--navy)}
:root[data-theme="light"] aside *{color:#EAF2F5}
.empsw{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
:root[data-theme="light"] .empsw{background:#ffffff14}
.empsw label{font-size:10px;color:var(--mut);letter-spacing:1.5px;text-transform:uppercase}
.empsw select{margin-top:6px;padding:8px 10px;font-weight:600}
nav{display:flex;flex-direction:column;gap:2px}
nav .grp{font-size:10px;letter-spacing:1.8px;color:var(--mut);margin:14px 10px 6px;text-transform:uppercase}
nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;text-align:left;color:var(--mut);font-weight:500;transition:.12s}
nav button:hover{background:#ffffff0d;color:var(--text)}
nav button.on{background:var(--orange);color:#fff;font-weight:700;box-shadow:0 8px 22px #F57C2040}
nav button .ic{width:18px;text-align:center;font-size:15px}
.who{margin-top:auto;font-size:12px;color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:8px}
main{padding:26px 30px 60px;max-width:1500px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h2{font-size:24px;font-weight:800}.top p{color:var(--mut);font-size:13px;margin-top:2px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{padding:7px 16px;border-radius:999px;font-weight:600;font-size:12px;color:var(--mut)}
.seg button.on{background:var(--orange);color:#fff}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:13px;color:var(--mut);font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.5px}
.kpi .d{font-size:12px;color:var(--mut);margin-top:4px}
.kpi.acc{background:linear-gradient(135deg,var(--orange),#ff9a4d);border:0;color:#fff}
.kpi.acc h3,.kpi.acc .d{color:#fff9}
.kpi.teal{background:linear-gradient(135deg,var(--teal),var(--navy));border:0;color:#fff}
.kpi.teal h3,.kpi.teal .d{color:#ffffffaa}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);text-align:left;padding:8px 10px;font-weight:600}
td{padding:11px 10px;border-top:1px solid var(--line);font-size:13px;vertical-align:middle}
.tw{overflow:auto}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:700;background:var(--panel2);color:var(--mut);white-space:nowrap}
.pill.ok{background:#2ECC8F22;color:var(--ok)}.pill.warn{background:#F5B82022;color:var(--warn)}.pill.bad{background:#EF5B5B22;color:var(--bad)}.pill.or{background:#F57C2022;color:var(--orange)}.pill.tl{background:#3FA7BA22;color:var(--teal-l)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:14px;overflow:auto;padding-bottom:10px}
.col{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.col h4{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between}
.kc{background:var(--panel2);border-radius:12px;padding:11px;margin-bottom:9px;border-left:3px solid var(--orange)}
.kc b{display:block;font-size:13px}.kc span{font-size:11px;color:var(--mut)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;color:var(--mut);text-align:center;padding:4px;text-transform:uppercase;letter-spacing:1px}
.cd{min-height:104px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;overflow:hidden}
.cd.today{border-color:var(--orange)}.cd.out{opacity:.35}
.cd .n{font-size:11px;font-weight:700;color:var(--mut);margin-bottom:4px}
.cd .e{font-size:10px;border-radius:6px;padding:2px 5px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:var(--panel2)}
.e.feed{background:#F57C2033;color:var(--orange)}.e.story{background:#3FA7BA33;color:var(--teal-l)}.e.reel{background:#B07CF533;color:#c9a4ff}.e.carrossel{background:#2ECC8F33;color:var(--ok)}
.e.cancelado{opacity:.35;text-decoration:line-through}
.phone{width:290px;margin:0 auto;background:#000;border-radius:34px;padding:10px;border:1px solid var(--line)}
.phone .scr{background:var(--bg);border-radius:26px;overflow:hidden}
.phone .ph{display:flex;align-items:center;gap:8px;padding:10px;font-size:12px;font-weight:700}
.phone .av{width:26px;height:26px;border-radius:50%;background:var(--orange)}
.phone img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:var(--panel2)}
.phone .cap{padding:10px;font-size:11px;color:var(--mut);max-height:130px;overflow:auto;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:20px;z-index:50}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;max-width:880px;width:100%;max-height:90vh;overflow:auto;position:relative}
.modal .x{position:absolute;right:16px;top:12px;font-size:22px;color:var(--mut)}
.row2{display:grid;grid-template-columns:300px 1fr;gap:22px}
.emp{padding:40px;text-align:center;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mut)}
.chip.on{background:var(--orange);border-color:var(--orange);color:#fff}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--orange))}
.card canvas{max-height:300px}
.menu-btn{display:none}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g2,.row2{grid-template-columns:1fr}}
@media(max-width:820px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;left:-290px;width:270px;z-index:40;transition:.2s}aside.open{left:0}
  main{padding:18px 16px 60px}.menu-btn{display:inline-flex;font-size:22px}.g3{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="lcard">
    <div class="logo" id="logoL"></div>
    <h1>Painel de gestão</h1>
    <p>Acesso restrito à equipe LAR e às empresas gerenciadas.</p>
    <label>E-mail</label><input id="em" type="email" autocomplete="username">
    <label>Senha</label><input id="pw" type="password" autocomplete="current-password">
    <button class="btn full" id="go">Entrar</button>
    <div class="err" id="lerr"></div>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="logo" id="logoS"></div>
    <div class="empsw"><label>Empresa</label><select id="emp"></select></div>
    <nav id="nav"></nav>
    <div class="who"><span id="uemail"></span><span><button class="btn ghost sm" id="theme">◐</button> <button class="btn ghost sm" id="out">Sair</button></span></div>
  </aside>
  <main>
    <div class="top">
      <div style="display:flex;gap:12px;align-items:center"><button class="menu-btn" id="mb">☰</button><div><h2 id="ttl"></h2><p id="sub"></p></div></div>
      <div id="tools"></div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="box"><button class="x" id="mx">×</button><div id="mbody"></div></div></div>

<script src="marketplaces.js"></script>
<script>
const SB_URL='https://qgunpfgdsqqgfkimvwhg.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFndW5wZmdkc3FxZ2ZraW12d2hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzMjQyMjIsImV4cCI6MjA5NzkwMDIyMn0.LUbnqiP1DPS1GEPrX5KYjHNYQeL_6V0bVgCzlEg49-Q';
const sb=supabase.createClient(SB_URL,SB_KEY);

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const R=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const D=v=>v?new Date(v).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'—';
const DT=v=>v?new Date(v).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysAgo=n=>new Date(Date.now()-n*864e5).toISOString();
$('#logoL').innerHTML='<img class="lg lg-d" src="logo-claro.png" alt="LAR Estratégia Digital"><img class="lg lg-l" src="logo-escuro.png" alt="LAR Estratégia Digital">';
$('#logoS').innerHTML='<img class="lg-side" src="logo-claro.png" alt="LAR Estratégia Digital">';
let S={user:null,emps:[],emp:null,range:7,page:'dashboard',charts:[]};
const clearCharts=()=>{S.charts.forEach(c=>c.destroy());S.charts=[]};
const chart=(id,cfg)=>{const el=document.getElementById(id);if(!el)return;Chart.defaults.color='#8FB0BD';Chart.defaults.font.family='Poppins';S.charts.push(new Chart(el,cfg))};
async function q(table,sel='*',f=x=>x){
  let b=sb.from(table).select(sel);
  if(S.emp&&S.emp!=='all')b=b.eq('empresa_id',S.emp);
  const {data,error}=await f(b);
  if(error){console.warn(table,error.message);window._qerr=table+': '+error.message;try{const el=document.getElementById('qerr')||Object.assign(document.createElement('div'),{id:'qerr'});el.style.cssText='position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#7a1f1f;color:#fff;padding:8px 14px;border-radius:10px;font-size:12px;z-index:99';el.textContent='Erro ao carregar '+table+': '+error.message;document.body.appendChild(el);setTimeout(()=>el.remove(),9000)}catch(e){}return[]}
  return data||[];
}
const stPill=s=>{s=(s||'').toLowerCase();const c=/pago|public|entreg|conclu|aprov|ativo|quit|ok/.test(s)?'ok':/cancel|atras|falh|erro|perd/.test(s)?'bad':/pend|aguard|rascun|orc|agend|revis|ajuste/.test(s)?'warn':'tl';return `<span class="pill ${c}">${esc(s||'—')}</span>`};
const empty=m=>`<div class="emp">${m}</div>`;
const tbl=(heads,rows)=>rows.length?`<div class="tw"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:empty('Sem registros para esta empresa ainda.');
function modal(html){$('#mbody').innerHTML=html;$('#modal').classList.remove('hidden')}
$('#mx').onclick=()=>$('#modal').classList.add('hidden');

/* ---------- auth ---------- */
$('#go').onclick=async()=>{
  $('#lerr').textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
  if(error)$('#lerr').textContent=(/invalid login/i.test(error.message)?'E-mail ou senha incorretos.':'Erro: '+error.message);else boot();
};
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('#go').click()});
$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
$('#theme').onclick=()=>{const l=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=l?'dark':'light';try{localStorage.setItem('lar_theme',l?'dark':'light')}catch(e){}render()};
try{const t=localStorage.getItem('lar_theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#mb').onclick=()=>$('#side').classList.toggle('open');

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('#login').classList.remove('hidden');$('#app').classList.add('hidden');return}
  S.user=session.user;$('#uemail').textContent=S.user.email;
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  const {data}=await sb.from('empresas').select('id,nome,slug').order('nome');
  S.emps=data||[];
  $('#emp').innerHTML=`<option value="all">Todas as empresas</option>`+S.emps.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join('');
  const tr=S.emps.find(e=>/trama/i.test(e.nome));
  S.emp=tr?tr.id:'all';$('#emp').value=S.emp;
  $('#emp').onchange=()=>{S.emp=$('#emp').value;render()};
  buildNav();render();
}

/* ---------- navegação ---------- */
const NAV=[
 ['Visão geral',[['dashboard','▦','Dashboard'],['comparativos','↗','Comparativos por setor']]],
 ['Comercial',[['vendas','◈','Vendas e pedidos'],['marketplaces','⌂','Marketplaces'],['fluxo','⇄','Fluxo do pedido'],['producao','▤','Produção'],['crm','☺','Clientes e CRM'],['leads','◎','Leads B2B']]],
 ['Financeiro',[['financeiro','$','Financeiro'],['dre','%','DRE e receita do bolo'],['documentos','▤','Documentos e leitor'],['conciliacao','⇄','Conciliação bancária'],['lotes','✔','Pagamento em lote'],['notas','▧','Notas fiscais'],['fornecedores','⚙','Fornecedores']]],
 ['Marketing',[['calendario','▣','Calendário de conteúdo'],['aprovacao','✓','Aprovação'],['feed','◫','Preview do feed'],['redes','☍','Redes conectadas']]],
 ['Inteligência',[['agenda','▥','Agenda'],['ia','✧','IA LAR'],['consultor','✦','Consultor IA'],['motivador','☀','Motivador'],['agentes','✦','Agentes IA'],['planos','◆','Planos e preços'],['regras','⚑','Regras por empresa'],['equipe','☻','Empresas e equipe']]]
];
function buildNav(){
  $('#nav').innerHTML=NAV.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([id,ic,l])=>`<button data-p="${id}"><span class="ic">${ic}</span>${l}</button>`).join('')).join('');
  $('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.page=b.dataset.p;$('#side').classList.remove('open');render()};
}
async function render(){
  clearCharts();
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.p===S.page));
  const v=$('#view');v.innerHTML=empty('Carregando…');$('#tools').innerHTML='';
  const fn=PAGES[S.page];const meta=fn.meta;
  $('#ttl').textContent=meta[0];$('#sub').textContent=meta[1]+(S.emp==='all'?' · todas as empresas':' · '+(S.emps.find(e=>e.id==S.emp)?.nome||''));
  await fn(v);
}
const rangeTool=()=>{ $('#tools').innerHTML=`<div class="seg">${[7,15,30].map(n=>`<button data-r="${n}" class="${S.range===n?'on':''}">${n} dias</button>`).join('')}</div>`;
  $('#tools').onclick=e=>{const b=e.target.closest('[data-r]');if(b){S.range=+b.dataset.r;render()}}};

/* ---------- páginas ---------- */
const PAGES={};

PAGES.dashboard=async v=>{
  rangeTool();
  const since=daysAgo(S.range);
  const [ped,lan,posts,leads]=await Promise.all([
    q('solarium_pedidos','id,numero_pedido,cliente_nome,valor_total,status,status_producao,criado_em',b=>b.gte('criado_em',since).order('criado_em',{ascending:false})),
    q('erp_lancamentos','tipo,valor,data,status,categoria',b=>b.gte('data',since.slice(0,10))),
    q('social_posts','id,formato,status,agendado_para,titulo',b=>b.gte('agendado_para',since)),
    q('leads_b2b','id,status,criado_em',b=>b.gte('criado_em',since))
  ]);
  const ent=lan.filter(l=>/entrada|receita|receber/i.test(l.tipo)).reduce((a,l)=>a+Number(l.valor),0);
  const sai=lan.filter(l=>/sa[ií]da|despesa|pagar/i.test(l.tipo)).reduce((a,l)=>a+Number(l.valor),0);
  const fat=ped.reduce((a,p)=>a+Number(p.valor_total||0),0);
  const pub=posts.filter(p=>/public/i.test(p.status)).length;
  v.innerHTML=`
  <div class="grid g4">
    <div class="card kpi acc"><h3>Faturamento (pedidos)</h3><div class="v">${R(fat)}</div><div class="d">${ped.length} pedidos em ${S.range} dias</div></div>
    <div class="card kpi teal"><h3>Saldo do período</h3><div class="v">${R(ent-sai)}</div><div class="d">${R(ent)} entradas · ${R(sai)} saídas</div></div>
    <div class="card kpi"><h3>Posts publicados</h3><div class="v">${pub}</div><div class="d">${posts.length} no período · ${posts.filter(p=>/agend|aprov/i.test(p.status)).length} na fila</div></div>
    <div class="card kpi"><h3>Novos leads</h3><div class="v">${leads.length}</div><div class="d">B2B no período</div></div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>Entradas × Saídas por dia</h3><canvas id="c1" height="150"></canvas></div>
    <div class="card"><h3>Posts por formato</h3><canvas id="c2" height="150"></canvas></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Pedidos recentes</h3>${tbl(['Nº','Cliente','Valor','Status','Data'],ped.slice(0,8).map(p=>[esc(p.numero_pedido),esc(p.cliente_nome),R(p.valor_total),stPill(p.status),D(p.criado_em)]))}</div>`;

const ETAPAS=[
 ['orcamento_aberto','Orçamento em aberto','Tina / Vendas','vendas'],

 ['separacao','Separação e expedição','Expedição','expedicao'],
 ['nota_fiscal','Nota fiscal','Financeiro / Fiscal','financeiro'],

const NEXTLBL={orcamento_aberto:'Fechar orçamento → virar pedido',aguardando_pagamento:'Pagamento definido → liberar expedição',separacao:'Conferido e meio definido → nota fiscal',nota_fiscal:'NF emitida → transporte',transporte:'Dar baixa na entrega'};
const MEIOS={transportadora:'Transportadora',veiculo_proprio:'Veículo próprio',retirada:'Retirada pelo cliente',correios:'Correios'};
const FORMAS={avista:'À vista',pix:'Pix',cartao:'Cartão',boleto:'Boleto'};

function novoOrcamento(){
  if(S.emp==='all')return modal('<h3>Escolha uma empresa</h3><p>Selecione a empresa no topo para criar o orçamento.</p>');
  modal(`<h3>Novo orçamento</h3>
   <label>Cliente</label><input id="oc_n"><label>Telefone / WhatsApp</label><input id="oc_t">
   <label>Itens (um por linha: descrição ; quantidade ; valor unitário)</label><textarea id="oc_i" rows="5" placeholder="Poltrona Bali ; 2 ; 1290"></textarea>
   <p id="oc_e" style="color:#ff8a6b"></p><button class="btn" id="oc_ok">Criar orçamento</button>`);
  $('#oc_ok').onclick=async()=>{
    const itens=$('#oc_i').value.split('\n').map(l=>l.split(';').map(s=>s.trim())).filter(a=>a[0]).map((a,i)=>({descricao:a[0],quantidade:Number((a[1]||'1').replace(',','.'))||1,valor_unitario:Number((a[2]||'0').replace(/[R$\s.]/g,'').replace(',','.'))||0,ordem:i}));
    if(!$('#oc_n').value.trim()||!itens.length){$('#oc_e').textContent='Informe o cliente e ao menos um item.';return}
    const total=itens.reduce((a,x)=>a+x.quantidade*x.valor_unitario,0);
    const {data:p,error}=await sb.from('solarium_pedidos').insert({empresa_id:S.emp,cliente_nome:$('#oc_n').value.trim(),cliente_telefone:$('#oc_t').value.trim()||null,valor_total:total,etapa_fluxo:'orcamento_aberto',status:'orcamento'}).select('id').single();
    if(error){$('#oc_e').textContent='Erro: '+error.message;return}
    await sb.from('solarium_pedido_itens').insert(itens.map(x=>({...x,pedido_id:p.id})));
    $('#modal').classList.add('hidden');render();
  };
}
async function abrirPedido(p){
  const {data:log}=await sb.from('pedido_fluxo_log').select('de,para,agente,usuario,criado_em').eq('pedido_id',p.id).order('criado_em',{ascending:false}).limit(15);
  const prox=NEXT[p.etapa_fluxo];let campos='';
  const sel=(id,obj,val)=>`<select id="${id}"><option value="">— escolher —</option>${Object.entries(obj).map(([k,l])=>`<option value="${k}" ${val===k?'selected':''}>${l}</option>`).join('')}</select>`;
  if(p.etapa_fluxo==='aguardando_pagamento')campos=`<label>Forma de pagamento</label>${sel('f_pg',FORMAS,p.pagto_forma)}`;
  if(p.etapa_fluxo==='separacao')campos=`<label>Meio de entrega</label>${sel('f_meio',MEIOS,p.entrega_meio)}<label>Transportadora (se houver)</label><select id="f_tr"><option value="">—</option>${(S.fluxoTransp||[]).map(t=>`<option value="${t.id}" ${p.transportadora_id===t.id?'selected':''}>${esc(t.nome_transportadora)}</option>`).join('')}</select>`;
  if(p.etapa_fluxo==='nota_fiscal')campos=`<label>Número da nota fiscal</label><input id="f_nf" value="${esc(p.numero_nota_fiscal||'')}"><p class="d">A emissão em si está na aba Notas fiscais; aqui você registra o número emitido.</p>`;
  if(p.etapa_fluxo==='transporte')campos=`<label>Motorista</label><input id="f_mo" value="${esc(p.entrega_motorista||'')}"><label>Veículo</label>${sel('f_ve',{moto:'Moto',carro:'Carro',van:'Van',caminhao:'Caminhão'},p.entrega_veiculo)}<label>Placa</label><input id="f_pl" value="${esc(p.entrega_placa||'')}"><label>Comprovante (nota assinada ou foto da entrega)</label><input type="file" id="f_fi" accept="image/*,application/pdf">`;
  modal(`<h3>${esc(p.numero_pedido)} · ${esc(p.cliente_nome)}</h3>
   <p>${R(p.valor_total)} ${p.cliente_telefone?'· '+esc(p.cliente_telefone):''}</p>
   <p class="d">Pagamento: ${FORMAS[p.pagto_forma]||'—'} · Entrega: ${MEIOS[p.entrega_meio]||'—'} · NF: ${esc(p.numero_nota_fiscal||'—')} ${p.entrega_placa?'· Placa '+esc(p.entrega_placa):''}</p>
   ${p.entrega_comprovante_url?'<p><a href="#" id="verComp">Ver comprovante</a></p>':''}
   ${campos}<p id="f_err" style="color:#ff8a6b"></p>
   ${prox?`<button class="btn" id="f_go">${NEXTLBL[p.etapa_fluxo]}</button>`:'<p>Pedido concluído.</p>'}
   <h4 style="margin-top:16px">Histórico</h4>${(log||[]).map(l=>`<div class="d">${DT(l.criado_em)} · ${esc(l.de||'')} → ${esc(l.para)} · agente ${esc(l.agente||'—')} · ${esc(l.usuario||'')}</div>`).join('')||'<div class="d">sem movimentos</div>'}`);
  if(p.entrega_comprovante_url)$('#verComp').onclick=async e=>{e.preventDefault();const {data}=await sb.storage.from('entregas').createSignedUrl(p.entrega_comprovante_url,300);if(data)window.open(data.signedUrl,'_blank')};
  if(prox)$('#f_go').onclick=async()=>{
    const dados={};const g=id=>document.getElementById(id)?.value||'';
    if(p.etapa_fluxo==='aguardando_pagamento')dados.pagto_forma=g('f_pg');
    if(p.etapa_fluxo==='separacao'){dados.entrega_meio=g('f_meio');dados.transportadora_id=g('f_tr')}
    if(p.etapa_fluxo==='nota_fiscal')dados.numero_nota_fiscal=g('f_nf');
    if(p.etapa_fluxo==='transporte'){dados.entrega_motorista=g('f_mo');dados.entrega_veiculo=g('f_ve');dados.entrega_placa=g('f_pl').toUpperCase();
      const fi=document.getElementById('f_fi')?.files[0];
      if(fi){const path=`${p.empresa_id}/${p.id}/${Date.now()}-${fi.name.replace(/[^\w.-]/g,'_')}`;const up=await sb.storage.from('entregas').upload(path,fi);if(up.error){$('#f_err').textContent='Falha ao enviar o arquivo: '+up.error.message;return}dados.entrega_comprovante_url=path}}
    Object.keys(dados).forEach(k=>{if(dados[k]==='')delete dados[k]});
    // etapa atual → próxima: os dados pedidos pela etapa de destino são os da etapa atual
    const alvo=NEXT[p.etapa_fluxo];
    const {data:r,error}=await sb.rpc('fluxo_avancar',{p_pedido:p.id,p_para:alvo,p_dados:dados});
    if(error||!r?.ok){$('#f_err').textContent=error?.message||r.erro;return}
    $('#modal').classList.add('hidden');render();
  };
}

const CHATS={assistente:[],consultor:[],cerebro:[]};
function chatPage(modo,intro){
  return async v=>{
    const emp=S.emp==='all'?S.emps[0]?.id:S.emp;const C=CHATS[modo];
    v.innerHTML=`<div class="card" style="max-width:860px"><div id="chat" style="min-height:320px;max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px"></div>

    const draw=()=>{$('#chat').innerHTML=C.length?C.map(m=>`<div style="align-self:${m.role==='user'?'flex-end':'flex-start'};max-width:85%;background:${m.role==='user'?'var(--orange)':'var(--panel2)'};color:${m.role==='user'?'#fff':'var(--text)'};padding:10px 14px;border-radius:16px;white-space:pre-wrap;font-size:13px">${esc(m.content)}</div>`).join(''):`<p style="color:var(--mut);font-size:13px">${intro}</p>`;$('#chat').scrollTop=1e6};
    draw();
    const send=async()=>{const t=$('#cin').value.trim();if(!t)return;$('#cin').value='';C.push({role:'user',content:t});C.push({role:'assistant',content:'…'});draw();
      const {data,error}=await sb.functions.invoke('ia-lar',{body:{empresa_id:emp,modo,mensagens:C.slice(0,-1)}});
      let r=data;if(!r&&error){try{r=await error.context.json()}catch(e){r={}}}
      C[C.length-1].content=r?.ok?r.resposta:(r?.mensagem||'Não consegui responder agora.');draw();
      if(r?.uso)$('#cuso').textContent=`Uso do mês: ${Math.round(r.uso.usado/1000)} mil de ${Math.round(r.uso.limite/1000)} mil unidades${r.uso.excedente?' · acima do pacote (excedente cobrado à parte)':''}`;};
    $('#csend').onclick=send;$('#cin').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
  };
}

  const dsem=['dom','seg','ter','qua','qui','sex','sáb'];
  const url=`${SB_URL}/functions/v1/agenda-ics?k=${ICS_KEY}&e=${emp}`;
  $('#tools').innerHTML=`<div class="seg">${[['dia','Dia'],['semana','Semana'],['mes','Mês'],['pend','Pendências']].map(([k,l])=>`<button data-v="${k}" class="${AG.vis===k?'on':''}">${l}</button>`).join('')}</div>`;
  $('#tools').onclick=e=>{const x=e.target.closest('[data-v]');if(x){AG.vis=x.dataset.v;render()}};
  const rotulo=AG.vis==='dia'?ref.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}):AG.vis==='semana'?`${D(a)} a ${D(new Date(b2-864e5))}`:AG.vis==='mes'?ref.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}):'Tudo que está em aberto';
  const passo=AG.vis==='dia'?1:AG.vis==='semana'?7:30;
  v.innerHTML=`<div class="grid g2" style="grid-template-columns:2fr 1fr"><div class="card"><h3><span>${rotulo}</span>${AG.vis!=='pend'?`<span><button class="btn ghost sm" id="ant">‹</button> <button class="btn ghost sm" id="hj">hoje</button> <button class="btn ghost sm" id="prx">›</button></span>`:''}</h3>
  ${dentro.length?dentro.map(e=>`<div style="display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)"><div style="min-width:78px;font-size:12px;color:var(--mut)">${dsem[new Date(e.inicio).getDay()]} ${D(e.inicio)}<br><b style="color:var(--text)">${hora(e)}</b></div><div style="flex:1"><b style="${e.status==='feito'?'text-decoration:line-through;opacity:.5':''}">${esc(e.titulo)}</b> <span class="pill ${cor[e.tipo]||''}">${esc(e.tipo)}</span><br><span style="font-size:12px;color:var(--mut)">${esc(e.descricao||'')}</span></div>${e.status!=='feito'?`<button class="btn ghost sm" data-ok="${e.id}">Feito</button>`:'<span class="pill ok">feito</span>'}</div>`).join(''):empty('Nada agendado neste período.')}</div>
  <div><div class="card"><h3>Novo compromisso</h3><input id="nt" placeholder="Título"><input id="nd" type="datetime-local" style="margin-top:8px"><select id="ntp" style="margin-top:8px"><option value="reuniao">Reunião</option><option value="pendencia">Pendência</option><option value="plano">Plano</option><option value="lembrete">Lembrete</option><option value="entrega">Entrega</option></select><input id="nds" placeholder="Detalhes (opcional)" style="margin-top:8px"><button class="btn full" id="nadd">Adicionar</button></div>
  <div class="card" style="margin-top:16px"><h3>Levar para o celular</h3><p style="font-size:12px;color:var(--mut);margin-bottom:8px">Assine este link na agenda do telefone (Google Agenda → Outras agendas → Por URL, ou iPhone → Calendário → Assinar). Reuniões, pendências e planos aparecem com lembrete.</p><input readonly value="${esc(url)}" onclick="this.select()" style="font-size:11px"></div></div></div>`;
  const nav=n=>()=>{AG.ref=new Date(ref.getTime()+n*864e5*passo);render()};
  if($('#ant')){$('#ant').onclick=nav(-1);$('#prx').onclick=nav(1);$('#hj').onclick=()=>{AG.ref=new Date();render()}}
  v.onclick=async e=>{const o=e.target.closest('[data-ok]');if(o){await sb.from('agenda_itens').update({status:'feito'}).eq('id',o.dataset.ok);render()}};
  $('#nadd').onclick=async()=>{const t=$('#nt').value.trim(),d=$('#nd').value;if(!t||!d)return alert('Preencha título e data/hora.');
    const {error}=await sb.from('agenda_itens').insert({empresa_id:emp,titulo:t,descricao:$('#nds').value,inicio:new Date(d).toISOString(),tipo:$('#ntp').value,lembrete_min:30,origem:'painel'});
    if(error)alert('Erro: '+error.message);else render()};
};
PAGES.agenda.meta=['Agenda','Reuniões, pendências e planos — dia, semana e mês'];

PAGES.equipe=async v=>{
  const {data}=await sb.from('empresas').select('nome,slug,cnpj,ativo');
  v.innerHTML=`<div class="grid g3">${(data||[]).map(e=>`<div class="card"><h3>${esc(e.nome)} ${e.ativo===false?'<span class="pill bad">inativa</span>':'<span class="pill ok">ativa</span>'}</h3><p style="color:var(--mut);font-size:12px">${esc(e.cnpj||'CNPJ não informado')}</p></div>`).join('')||empty('Sem empresas.')}</div>
  <div class="card" style="margin-top:16px"><h3>Modelo para as 4 empresas</h3><p style="font-size:13px">Trama Artesanal é o piloto. Para onboardar outra empresa: cadastrar em <b>empresas</b>, conectar contas sociais, definir paleta/horários e ativar agentes. O seletor no topo do menu isola os dados por empresa (RLS).</p></div>`;
};
PAGES.equipe.meta=['Empresas e equipe','Marcas gerenciadas pela LAR'];

</script>

<script src="comparativos.js"></script>
<script src="exportar.js"></script>
<script src="afiliados.js"></script>
<script>boot();</script>
